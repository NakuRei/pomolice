[package]
name = "pomolice-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
thiserror = "2"
log = "0.4"

[dev-dependencies]
chrono-tz = "0.10"
serde_json = "1"

[lints]
workspace = true
