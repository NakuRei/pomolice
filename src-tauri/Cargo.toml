[package]
name = "pomolice"
version = "0.1.0"
description = "Pomodoro timer that forces you to take breaks"
authors = ["NakuRei <nakurei7901@gmail.com>"]
license = "MIT"
edition = "2021"
default-run = "pomolice"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pomolice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[features]
e2e = ["dep:tauri-plugin-wdio"]

[dependencies]
tauri-plugin-wdio = { version = "1.4.0", optional = true }
pomolice-core = { path = "../crates/pomolice-core" }
tauri = { version = "2.12.1", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-notification = "2.5.1"
tauri-plugin-log = "2.10.0"
tauri-plugin-single-instance = "2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive", "function", "chrono"] }
tauri-specta = "=2.0.0-rc.21"
rdev = "0.5"
atomic-write-file = "0.3"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
parking_lot = "0.12"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
# Standalone utility binary `src/bin/export_tray_icon_fixtures.rs` still uses tracing;
# the application runtime under `src/` uses `log` via tauri-plugin-log.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
zbus = { version = "5.15", default-features = false, features = ["tokio"] }

[dev-dependencies]
specta-typescript = "=0.0.9"
heck = "0.5"
tauri = { version = "2.12.1", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
