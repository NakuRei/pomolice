[package]
name = "pomolice"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "pomolice"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pomolice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive", "function", "chrono"] }
tauri-specta = "=2.0.0-rc.21"
rdev = "0.5"
atomic-write-file = "0.3"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
parking_lot = "0.12"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
# Standalone utility binary `src/bin/export_tray_icon_fixtures.rs` still uses tracing;
# the application runtime under `src/` uses `log` via tauri-plugin-log.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
zbus = { version = "5.15", default-features = false, features = ["tokio"] }

[dev-dependencies]
specta-typescript = "=0.0.9"
heck = "0.5"
tauri = { version = "2", features = ["test"] }
chrono-tz = "0.10"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
single_use_lifetimes = "warn"
unreachable_pub = "warn"
non_ascii_idents = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
await_holding_lock = "deny"
await_holding_invalid_type = "deny"
dbg_macro = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes = "deny"
clone_on_ref_ptr = "deny"
exit = "deny"
unused_result_ok = "deny"
