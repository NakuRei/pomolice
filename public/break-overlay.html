<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #111827;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }

        .message {
            font-size: 48px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
        }

        .submessage {
            font-size: 24px;
            color: #9ca3af;
            text-align: center;
        }

        .icon {
            font-size: 120px;
            margin-bottom: 32px;
        }
    </style>
</head>
<body>
    <div class="icon">☕</div>
    <div class="message">休憩中</div>
    <div class="submessage">メインディスプレイを確認してください</div>
</body>
</html>
