<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Break Overlay</title>
    <style>
      :root {
        --color-background: #09090b;
        --color-text: #f4f4f5;
        --color-text-muted: #a1a1aa;
        --color-primary: #06b6d4;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--color-background);
        color: var(--color-text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
      }

      .message {
        font-size: 48px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 24px;
      }

      .submessage {
        font-size: 24px;
        color: var(--color-text-muted);
        text-align: center;
      }

      .icon {
        font-size: 120px;
        margin-bottom: 32px;
        color: var(--color-primary);
      }

      .emergency-release {
        position: absolute;
        bottom: 16px;
        left: 12px;
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .emergency-release kbd {
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <p class="emergency-release">緊急解除：<kbd>Ctrl + Alt + Shift + E</kbd></p>
    <div class="icon">☕</div>
    <div class="message">休憩中</div>
    <div class="submessage">メインディスプレイを確認してください</div>
  </body>
</html>
