<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Break Overlay</title>
    <link rel="stylesheet" href="/src/breakOverlay.css" />
    <style>
      /* Served from public/, so it cannot read the app's theme tokens.
         Keep these in step with src/index.css. */
      :root {
        --color-background: #0d1727;
        --color-background-mid: #0f1f2a;
        --color-background-glow: #1a3a3a;
        --color-text: #e6ecf4;
        --color-text-muted: #8195af;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--color-background);
        background-image: radial-gradient(
          70% 80% at 50% 100%,
          var(--color-background-glow) 0%,
          var(--color-background-mid) 55%,
          var(--color-background) 100%
        );
        color: var(--color-text);
        font-family: "JetBrains Mono", "Noto Sans JP", ui-monospace, monospace;
        overflow: hidden;
      }

      .message {
        font-size: 48px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 24px;
      }

      .submessage {
        font-size: 24px;
        color: var(--color-text-muted);
        text-align: center;
      }

      .emergency-release {
        position: absolute;
        bottom: 16px;
        left: 12px;
        font-size: 12px;
        color: var(--color-text-muted);
      }

      .emergency-release kbd {
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <p class="emergency-release">緊急解除：<kbd>Ctrl + Alt + Shift + E</kbd></p>
    <div class="message">休憩中</div>
    <div class="submessage">メインディスプレイを確認してください</div>
  </body>
</html>
