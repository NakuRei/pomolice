name: Create draft release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/distribution
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Install Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.92.0
      - run: npm ci
      - name: Verify release tag
        run: npm run release:check -- "$env:RELEASE_TAG"
      - run: npm run verify
      - run: npm run test:e2e
      - run: npm run build:windows
      - name: Verify installer contents
        run: |
          $version = node scripts/check-release-version.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem target/distribution/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          ./scripts/verify-windows-bundle.ps1 -Installer $installers[0].FullName -ExpectedVersion $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path artifacts/windows -Force | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination artifacts/windows
          $hash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content -Encoding utf8 artifacts/windows/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pomolice-windows-x64
          path: artifacts/windows/
          if-no-files-found: error
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-e2e-diagnostics
          path: artifacts/e2e/
          if-no-files-found: ignore

  ubuntu:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and build Ubuntu package
        run: >-
          docker build --platform linux/amd64
          --file docker/ubuntu26.Dockerfile
          --build-arg RELEASE_TAG="$RELEASE_TAG"
          --output type=local,dest=artifacts/ubuntu26 .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pomolice-ubuntu26-amd64
          path: artifacts/ubuntu26/
          if-no-files-found: error

  draft-release:
    needs: [windows, ubuntu]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Download verified installers
        run: |
          gh run download "$GITHUB_RUN_ID" --name pomolice-windows-x64 --dir artifacts/release-input/windows
          gh run download "$GITHUB_RUN_ID" --name pomolice-ubuntu26-amd64 --dir artifacts/release-input/ubuntu
      - name: Prepare release assets
        run: node scripts/prepare-release.mjs "$RELEASE_TAG" artifacts/release-input artifacts/release
      - name: Create draft release
        run: |
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > artifacts/release-tags.txt
          if grep -Fxq -- "$RELEASE_TAG" artifacts/release-tags.txt; then
            echo "A release already exists for $RELEASE_TAG; refusing to replace it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            artifacts/release/*.exe artifacts/release/*.deb artifacts/release/SHA256SUMS \
            --verify-tag --draft --title "Pomolice $RELEASE_TAG" \
            --generate-notes --notes-file artifacts/release/notes.md
